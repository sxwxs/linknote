# LinkNote Default Configuration

# Data directory configuration
# If not set, will use default system path
data_dir: null

# Login configuration
login:
  # Enable/disable login requirement
  enabled: false
  
  # Login type: "email" or "oauth"
  type: "oauth"
  
  # Email login configuration
  email:
    # Enable/disable email login
    enabled: false
    # Allow anyone with a valid email address to request a login link.
    # If false, only `allowed_emails` (or `admin_email` as a fallback) can log in.
    allow_anyone: false
    # Comma-separated string or YAML list of emails allowed when allow_anyone=false.
    allowed_emails: []
    # Email account for sending login links
    account: ""
    # Email password or app-specific password
    password: ""
    # SMTP server settings
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    # Advanced SMTP settings (optional)
    smtp_use_ssl: false
    smtp_starttls: true
    # Magic-link and CAPTCHA settings
    token_ttl_seconds: 900
    require_captcha: true
    captcha:
      ttl_seconds: 300
    # If set, used to build the verify URL in emails (otherwise uses request.url_root).
    base_url: ""
    # Where to redirect after clicking the email link.
    redirect_path: "/static/index.html"
    # Daily logs written as YYYY-mm-dd.log inside these directories.
    logs:
      login_dir: "logs/login"
      email_dir: "logs/email"
  
  # OAuth configuration (legacy)
  # Application ID for authentication
  appid: ""
  
  # Login request URL
  # The system will append ?token=xxx&appid=xxx to this URL
  login_request_url: ""
  
  # Callback settings for the authentication server
  callback:
    # List of allowed IP addresses that can call the callback API
    ip_whitelist: []
    
    # Example:
    # ip_whitelist:
    #   - "10.0.0.1"
    #   - "192.168.1.100"

# Server configuration
server:
  # Session secret key for Flask sessions
  # IMPORTANT: Change this in your actual config file!
  secret_key: "change-this-in-your-config"
